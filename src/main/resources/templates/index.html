<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>IntelliDoc</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            margin-bottom: 10px;
        }

        .description {
            color: #666;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed #aaa;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
        }

        input[type="file"] {
            margin: 20px 0;
        }

        button {
            background: #222;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        .error {
            background: #ffe5e5;
            color: #a00;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 6px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>IntelliDoc</h1>

    <p class="description">
        Plataforma inteligente para procesamiento y análisis documental.
    </p>

    <div th:if="${error}" class="error">
        <strong>Error:</strong>
        <span th:text="${error}"></span>
    </div>

    <form
            method="post"
            action="/documents/process"
            enctype="multipart/form-data">

        <div class="upload-box">

            <h2>Procesar documento</h2>

            <p>
                Selecciona un documento para iniciar el procesamiento.
            </p>

            <input
                    type="file"
                    name="file"
                    required
            >

            <br>

            <button type="submit">
                Procesar documento
            </button>

        </div>

    </form>

</div>

</body>
</html>
